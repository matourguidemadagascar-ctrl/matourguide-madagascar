<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | Ma'Tour Guide Madagascar</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="base.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            background:var(--dusk);
        }

        .login-box{
            width:100%;
            max-width:400px;
            background:var(--white);
            border-radius:var(--radius-card);
            padding:44px 38px;
            box-shadow:var(--shadow);
        }

        .login-box h1{
            font-family:var(--display);
            font-weight:600;
            font-size:26px;
            color:var(--bark);
            margin-bottom:8px;
        }

        .login-box p{
            font-size:14px;
            color:var(--bark-soft);
            margin-bottom:28px;
        }

        .login-field{
            margin-bottom:18px;
        }

        .login-field label{
            display:block;
            font-weight:600;
            font-size:13.5px;
            color:var(--bark);
            margin-bottom:8px;
        }

        .login-field input{
            width:100%;
            padding:14px 16px;
            border:1.5px solid rgba(59,42,32,.18);
            border-radius:12px;
            font-family:var(--body);
            font-size:15px;
            color:var(--bark);
            background:var(--sand);
            outline:none;
            transition:.3s;
        }

        .login-field input:focus{
            border-color:var(--ember);
            background:var(--white);
        }

        .login-submit{
            width:100%;
            border:none;
            cursor:pointer;
            margin-top:6px;
        }

        .login-error{
            display:none;
            margin-top:18px;
            padding:12px 16px;
            border-radius:10px;
            background:rgba(193,85,43,.1);
            border:1px solid rgba(193,85,43,.3);
            color:var(--ember);
            font-size:13.5px;
        }

        .login-error.is-visible{
            display:block;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h1>Espace Administrateur</h1>
        <p>Ma'Tour Guide Madagascar — accès réservé</p>

        <form id="login-form">

            <div class="login-field">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required autocomplete="username">
            </div>

            <div class="login-field">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn login-submit">Se connecter</button>

            <div class="login-error" id="login-error"></div>

        </form>

    </div>

    <script type="module" src="js/auth.js"></script>

</body>

</html>
